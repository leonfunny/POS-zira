import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def productVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version.toString()
if (!(productVersion ==~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/)) {
    throw new GradleException("package.json version is not semantic: ${productVersion}")
}

def androidBuildNumberText = (findProperty('ziraAndroidBuildNumber')
    ?: System.getenv('ZIRA_ANDROID_BUILD_NUMBER')
    ?: '1').toString()
if (!(androidBuildNumberText ==~ /^[1-9]\d*$/)) {
    throw new GradleException('Android build number must be a positive integer')
}
def androidBuildNumberLong = Long.parseLong(androidBuildNumberText)
if (androidBuildNumberLong > 2100000000L) {
    throw new GradleException('Android build number exceeds the supported versionCode range')
}
def androidBuildNumber = androidBuildNumberLong.toInteger()

// Sideload signer. This is NOT a Play upload key and NOT a Play app-signing key
// — those stay three separate identities (see the production-readiness gate).
// It exists because AppUpdaterPlugin refuses any update whose signer differs
// from the installed app's, so sideloaded terminals need one stable signer.
// Material comes only from the environment; nothing signing-related is ever
// committed. Absent env vars, release stays unsigned and the build still runs.
def sideloadKeystorePath = System.getenv('ZIRA_ANDROID_KEYSTORE')
def sideloadKeystore = sideloadKeystorePath ? file(sideloadKeystorePath) : null
def hasSideloadSigner = sideloadKeystore?.exists()
    && System.getenv('ZIRA_ANDROID_KEYSTORE_PASSWORD')
    && System.getenv('ZIRA_ANDROID_KEY_ALIAS')
    && System.getenv('ZIRA_ANDROID_KEY_PASSWORD')

android {
    namespace = "com.ziraai.posdiagnostics.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasSideloadSigner) {
            sideload {
                storeFile sideloadKeystore
                storePassword System.getenv('ZIRA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZIRA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ZIRA_ANDROID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    defaultConfig {
        applicationId "com.ziraai.posdiagnostics.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidBuildNumber
        versionName productVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            debuggable false
        }
        liveDebug {
            initWith debug
            applicationIdSuffix ".live"
            versionNameSuffix "-live"
            debuggable true
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSideloadSigner) {
                signingConfig signingConfigs.sideload
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // S4: Keystore-backed EncryptedSharedPreferences backing the SecureKV
    // native plugin (in-app token store for the Android POS shim).
    implementation "androidx.security:security-crypto:$androidxSecurityCryptoVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
